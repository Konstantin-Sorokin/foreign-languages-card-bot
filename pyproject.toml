[project]
name = "foreign-languages-cards-bot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.0.1",
    "aiogram>=3.26.0",
    "aiohttp>=3.13.5",
    "aiohttp-socks>=0.11.0",
    "pydantic-settings>=2.13.1",
    "redis>=8.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
